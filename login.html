<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expresso Viajante</title>
</head>

<body>
    <header>

        <img src="assets/img/Expresso viajante.png" alt="Logotipo da Expresso Viajante" id="logo">
        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="index.html" title="Voltar à página inicial">Início</a></li>
                <li><a href="login.html" aria-current="page">Login</a></li>
                <li><a href="cadastro.html">Cadastre-se</a></li>
                <li><a href="carrinho.html" title="Acessar seu carrinho de compras">Carrinho</a></li>
            </ul>
        </nav>
        <hr>

    </header>
    <main>

        <section id="login" aria-labelledby="login">
            <h2>Acesse sua conta</h2>

            <div class="login-usuario">
                <form name="usuariologin" method="post" autocomplete="on" action="#">
                    <fieldset>
                        <legend class="info-login">Informações de login</legend>

                        <div class="form-grupo">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" placeholder="seu@email.com"
                                autocomplete="username" required aria-required="true">
                        </div>

                        <div class="form-grupo">
                            <label for="senha">Senha:</label>
                            <input type="password" id="senha" name="senha" placeholder="Digite sua senha"
                                autocomplete="current-password" required aria-required="true" minlength="6">
                        </div>

                        <button type="submit" aria-label="Entrar na minha conta">Entrar</button>
                    </fieldset>
                </form>

                <div class="links-uteis" aria-label="Links úteis">
                    <p>
                        <a href="recuperar-senha.html" aria-label="Recuperar senha de acesso">Esqueceu sua senha?</a>
                    </p>
                    <p>
                        Não tem conta? <a href="cadastro.html" aria-label="Criar nova conta">Cadastre-se</a>
                    </p>
                </div>
            </div>
        </section>

    </main>
<footer>
    <span>
        <p>Todos os direitos reservados &copy; 2025 Expresso Viajante </p>
    </span>
</footer>
</body>
</html>
